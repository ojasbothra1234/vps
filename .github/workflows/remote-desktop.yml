name: Ubuntu RDP Debug

on:
  workflow_dispatch:

jobs:
  rdp-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install RDP and Desktop Environment
        run: |
          sudo apt update
          sudo apt install -y xfce4 xrdp jq
          echo xfce4-session > ~/.xsession
          sudo cp ~/.xsession /etc/skel/
          sudo systemctl enable xrdp

      - name: Set RDP User Password
        run: |
          # The default user on GitHub Actions Ubuntu runners is 'runner'
          if [ -z "${{ secrets.RDP_PASSWORD }}" ]; then
            echo "Error: RDP_PASSWORD secret is not set. Please add it to your repository secrets." >&2
            exit 1
          fi
          echo "runner:${{ secrets.RDP_PASSWORD }}" | sudo chpasswd

      - name: Start XRDP Service
        run: |
          sudo systemctl start xrdp

      - name: Setup ngrok Tunnel
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          if [ -z "$NGROK_AUTH_TOKEN" ]; then
            echo "Error: NGROK_AUTH_TOKEN secret is not set. Please add it to your repository secrets." >&2
            exit 1
          fi
          
          # Download and install ngrok v3
          curl -s https://ngrok-binaries.s3.amazonaws.com/ngrok-v3-stable-linux-amd64.zip -o ngrok.zip
          unzip ngrok.zip
          
          # Authenticate ngrok and start a TCP tunnel for RDP (port 3389)
          ./ngrok authtoken "$NGROK_AUTH_TOKEN"
          nohup ./ngrok tcp 3389 --log=stdout > ngrok.log 2>&1 &
          
          # Wait for ngrok to establish the tunnel and fetch the public URL
          sleep 10
          NGROK_URL=$(curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[] | select(.proto == "tcp") | .public_url')
          
          echo "::notice file=ngrok.log::Ngrok Tunnel established."
          echo "::notice file=ngrok.log::Ngrok Tunnel URL: $NGROK_URL"
          echo "Ngrok Tunnel URL: $NGROK_URL"
          echo "To connect: Use an RDP client with address $NGROK_URL"
          
          # Make the URL available as a job output (optional, for scripting)
          echo "NGROK_URL=$NGROK_URL" >> $GITHUB_ENV

      - name: Keep Runner Alive
        run: |
          echo "RDP session is active. This job will run until the timeout (360 minutes) or until manually cancelled."
          while true; do sleep 60; done
